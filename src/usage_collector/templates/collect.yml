# 非公開の運用リポジトリに配置するサンプル。OWNERを公開ライブラリの所有者に変更する。
# mainは保護したまま、dataブランチにのみコミットする。
name: PyPI & GA4 Usage Collector
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *' # 日本時間03:17
permissions:
  contents: write
concurrency:
  group: usage-collector-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public library
        run: python -m pip install 'git+https://github.com/OWNER/usage_collector.git@main'
      - name: Prepare data branch
        run: |
          git fetch origin refs/heads/data:refs/remotes/origin/data
          git worktree add --detach "$RUNNER_TEMP/usage-data" refs/remotes/origin/data
          mkdir -p "$RUNNER_TEMP/usage-data/data"
      - name: Collect PyPI
        run: python scripts/collect.py --config config/settings.yml --source pypi --output "$RUNNER_TEMP/usage-data/data"
      - name: Collect GA4
        if: ${{ vars.GA4_PROPERTY_ID != '' }}
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo 'GA4 credentials missing' >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-credentials.json"
          chmod 600 "$RUNNER_TEMP/google-credentials.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/google-credentials.json"
          python scripts/collect.py --config config/settings.yml --source ga4 --ga4-days 3 --output "$RUNNER_TEMP/usage-data/data"
      - name: Persist CSV to data branch
        run: |
          git -C "$RUNNER_TEMP/usage-data" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/usage-data" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/usage-data" add data
          if git -C "$RUNNER_TEMP/usage-data" diff --cached --quiet; then
            exit 0
          fi
          git -C "$RUNNER_TEMP/usage-data" commit -m 'data: update usage statistics'
          git -C "$RUNNER_TEMP/usage-data" push origin HEAD:data
